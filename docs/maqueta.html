<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maqueta — Dotfiles Studio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
/* Variables de respaldo: imitan las del anfitrión donde se mostró la maqueta. */
:root{color-scheme:light;
--bg-primary:#ffffff;--surface-1:#f4f3ef;--surface-2:#ffffff;
--text-primary:#1c1c1e;--text-secondary:#6b6b66;--text-muted:#8e8e88;
--text-accent:#2563eb;--text-success:#15803d;--text-warning:#b45309;--text-danger:#b91c1c;
--border:rgba(0,0,0,.12);--border-strong:rgba(0,0,0,.24);--border-accent:#2563eb;--border-danger:#dc2626;--border-warning:#d97706;
--bg-accent:#dbe7fd;--bg-accent-muted:#eef3fe;--bg-success:#dcfce7;--bg-warning:#fef3c7;--bg-danger:#fee2e2;
--fill-accent:#2563eb;--fill-success:#16a34a;--fill-warning:#d97706;--fill-danger:#dc2626;--fill-ghost-selected:rgba(0,0,0,.06);
--on-accent:#ffffff;--radius:8px;
--font-sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--font-mono:"JetBrains Mono",ui-monospace,monospace;--font-voice:Georgia,"Source Serif 4",serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
--bg-primary:#1c1c1e;--surface-1:#242426;--surface-2:#2c2c2e;
--text-primary:#f5f5f0;--text-secondary:#a0a09a;--text-muted:#7c7c76;
--text-accent:#7aa7ff;--text-success:#4ade80;--text-warning:#fbbf24;--text-danger:#f87171;
--border:rgba(255,255,255,.12);--border-strong:rgba(255,255,255,.24);--border-accent:#7aa7ff;
--bg-accent:#1e3a6e;--bg-accent-muted:#1a2740;--bg-success:#14532d;--bg-warning:#4a3410;--bg-danger:#4c1d1d;
--fill-ghost-selected:rgba(255,255,255,.08)}}
body{margin:0;padding:24px 16px;background:var(--bg-primary);color:var(--text-primary);font-family:var(--font-sans);font-size:14px;line-height:1.5}
main{max-width:1100px;margin:0 auto}
.encabezado{margin:0 0 14px}.encabezado h1{font-size:18px;font-weight:600;margin:0}
.encabezado p{margin:4px 0 0;color:var(--text-secondary);font-size:12px}
button{font:inherit;color:var(--text-primary);background:var(--surface-2);border:0.5px solid var(--border-strong);border-radius:var(--radius);cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
<style>
/* La metáfora de Dotfiles Studio: La portada de tarjetas de paquetes (cada una con su enlace y su estado de stow) y la terminal abajo con la simulación, porque aquí la salida de stow es lo que se lee. Acento propio #4f46e5; en la app el color sale del tema de KDE. */
.nota-maqueta{color:var(--text-secondary);font-size:13px;margin:0 0 12px;max-width:820px}
.win{border:0.5px solid var(--border);border-radius:12px;overflow:hidden;font-size:12px;background:var(--surface-2);box-shadow:0 8px 30px rgb(0 0 0 / .10)}
.tit{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:0.5px solid var(--border);background:var(--surface-1)}
.mut{color:var(--text-secondary);font-size:11px}
.mono{font-family:var(--font-mono);font-size:11px;line-height:1.55}
.row{display:flex;align-items:center;gap:6px}
.btn{font-size:11px;padding:3px 9px}
.pane{border-right:0.5px solid var(--border);padding:8px;overflow:hidden}
.dt{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
</style>
</head>
<body>
<main>
<header class="encabezado"><h1>Maqueta — Dotfiles Studio</h1>
<p>Aprobada el 2026-11-18 (versión «identidad propia»).</p></header>
<p class="nota-maqueta">La portada de tarjetas de paquetes (cada una con su enlace y su estado de stow) y la terminal abajo con la simulación, porque aquí la salida de stow es lo que se lee.</p>
<div id="vista" aria-label="Ventana de Dotfiles Studio"></div>
</main>
<script>
const A={"dotfiles": "#4f46e5"};
const el=id=>document.getElementById(id);
const tb=(c,t,extra)=>`<div class="tit"><i class="ti ${t[0]}" style="color:${c};font-size:15px" aria-hidden="true"></i><span style="font-weight:500">${t[1]}</span>${extra||""}</div>`;
const vista=c=>`<div class="win">${tb(c,["ti-adjustments","Dotfiles"],`<span class="mut">~/.dotfiles · 31 paquetes</span><span style="flex:1"></span><button class="btn">Simular</button><button class="btn">Subir a GitHub…</button>`)}
<div style="display:grid;grid-template-columns:120px minmax(0,1fr)">
<div class="pane">${["Portada","Paquetes","Cambios","Sistema","Seguridad","Guía"].map((s,i)=>`<div style="padding:4px 6px;border-radius:4px;${i===0?`background:${c}1f;color:${c}`:""}">${s}</div>`).join("")}</div>
<div style="padding:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px">${[["ti-brand-kde","kde","42 archivos",1],["ti-terminal","zsh","1 conflicto",0],["ti-terminal-2","konsole","3 archivos",1],["ti-git-branch","git","2 archivos",1],["ti-notebook","obsidian","hasta la ola 8",1],["ti-brand-vscode","code","5 cambios",2]].map(p=>`<div style="border:0.5px solid var(--border);border-radius:8px;padding:8px;${p[3]===0?"border-color:var(--border-danger)":""}"><div class="row"><i class="ti ${p[0]}" style="font-size:18px;color:${c}" aria-hidden="true"></i><span style="font-weight:500;flex:1">${p[1]}</span><span class="dt" style="background:${p[3]===1?"var(--text-success)":p[3]===0?"var(--text-danger)":"var(--text-warning)"}"></span></div><div class="mut" style="margin-top:4px">${p[2]}</div></div>`).join("")}</div></div>
<div class="mono" style="background:var(--surface-1);border-top:0.5px solid var(--border);padding:8px 10px"><span style="color:${c}">$</span> stow -n -v zsh<br>LINK: .zshrc => .dotfiles/zsh/.zshrc<br><span style="color:var(--text-danger)">CONFLICTO: .zshenv existe y no es un enlace</span><br><span class="mut">simulación · nada escrito</span></div></div>`;
el("vista").innerHTML=vista("#4f46e5");
</script>
</body>
</html>
