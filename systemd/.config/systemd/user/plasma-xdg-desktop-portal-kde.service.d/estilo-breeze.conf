# El portal de escritorio de KDE (los diálogos de abrir y guardar de Zen, Chrome,
# Telegram y demás aplicaciones aisladas) se dibuja con Breeze en lugar de Kvantum.
# Con Kvantum, la vista en detalle del diálogo corta con «…» las columnas Tamaño y
# Fecha: KFileItemDelegate mide la celda con su margen y se la pasa al estilo, Kvantum
# recalcula el tamaño desde el texto y descarta ese margen, y al pintar se restan los
# dos (faltan 2·PM_FocusFrameHMargin píxeles; ni el mínimo de Kvantum, 2, alcanza).
# Breeze suma su propio margen y el texto cabe. Los colores siguen siendo los del
# esquema activo (Lliphi). Tras enlazar: systemctl --user daemon-reload y
# systemctl --user restart plasma-xdg-desktop-portal-kde.service
[Service]
Environment=QT_STYLE_OVERRIDE=Breeze
